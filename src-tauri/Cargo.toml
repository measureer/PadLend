[package]
name = "padlend-desktop"
version = "1.7.10"
description = "PadLend - share keyboard and mouse with an Android tablet"
authors = ["PadLend contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "padlend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
# 1.4.0：可选音频转发；只在用户开启 misc.forward_audio 时真正播放。
cpal = "0.15"
# 1.7.2：GUI 进程没有控制台，外壳日志要自己带本地时间戳。
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 1.7.6：检查更新走 WinHTTP —— 前端 fetch 读不了 github.com（没有 CORS），
# 而 WinHTTP 还能顺带用上 Windows 的系统代理设置。
windows = { version = "0.62", features = ["Win32_Networking_WinHttp"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
