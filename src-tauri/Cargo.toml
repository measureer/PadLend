[package]
name = "padlend-desktop"
version = "2.5.0"
description = "PadLend - share keyboard and mouse with an Android tablet"
authors = ["PadLend contributors"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "padlend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
# 1.4.0：可选音频转发；只在用户开启 misc.forward_audio 时真正播放。
cpal = "0.15"
# 1.7.2：GUI 进程没有控制台，外壳日志要自己带本地时间戳。
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 1.7.6：检查更新走 WinHTTP —— 前端 fetch 读不了 github.com（没有 CORS），
# 而 WinHTTP 还能顺带用上 Windows 的系统代理设置。
# 2.2.2：音频设备跟随加 MMDeviceEnumerator / IMMNotificationClient ——
# Win32_Media_Audio（枚举端点）、Win32_System_Com（CoInitializeEx 等）、
# Win32_Security（CoTaskMemFree 被 windows 门控在这个 feature 后面）。
windows = { version = "0.62", features = [
    "Win32_Networking_WinHttp",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_Security",
] }
# 2.2.2：#[implement] 宏生成的代码引用 ::windows_core:: 绝对路径，
# 下游 crate 必须把 windows-core 声明为直接依赖才能解析。
windows-core = "0.62"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
