[package]
name = "padlend-core"
version = "1.4.0"
edition = "2021"
rust-version = "1.82"
description = "PadLend Rust sidecar — NDJSON RPC over stdin/stdout (B2 migration)"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.21"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Input", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_ProcessStatus", "Win32_UI_HiDpi"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
