name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: build and publish Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # 引擎是独立 crate，两个 target 目录都要缓存。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            padlend-core -> target

      - name: Verify tag matches tauri.conf.json version
        shell: pwsh
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ("v$($conf.version)" -ne $env:GITHUB_REF_NAME) {
            Write-Error "tag $env:GITHUB_REF_NAME does not match tauri.conf.json version $($conf.version)"
            exit 1
          }
          Write-Host "version $($conf.version) ok"

      - name: Install
        run: npm ci

      - name: Tests
        run: |
          cargo test --manifest-path padlend-core\Cargo.toml
          npx vitest run

      # 一条命令完成：前端 → 引擎 → Tauri 外壳 → NSIS 安装包 → 免安装 zip → SHA256。
      - name: Bundle
        run: powershell -ExecutionPolicy Bypass -File tools\release.ps1 -SkipTests

      - name: Show outputs
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Select-Object Name, Length
          Get-Content dist\SHA256SUMS.txt

      - name: Publish GitHub Release
        # 手动触发只构建产物，不发布：只有 tag 才能创建 Release。
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          body_path: .github/release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: false
          files: |
            dist/PadLend-*-win64.zip
            dist/PadLend-*-setup.exe
            dist/SHA256SUMS.txt
