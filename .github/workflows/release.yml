name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: build and publish Windows release
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PADLEND_SIGN_CERT_B64: ${{ secrets.PADLEND_SIGN_CERT_B64 }}
      PADLEND_SIGN_PASSWORD: ${{ secrets.PADLEND_SIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify tag matches padlend.__version__
        shell: pwsh
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = python -c "import padlend; print(padlend.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "tag ${{ github.ref_name }} does not match padlend.__version__ $version"
            exit 1
          }

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r requirements-build.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
        continue-on-error: true

      - name: Decode signing certificate (optional)
        if: env.PADLEND_SIGN_CERT_B64 != ''
        shell: pwsh
        run: |
          $cert = Join-Path $env:RUNNER_TEMP "padlend-sign.pfx"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env.PADLEND_SIGN_CERT_B64))
          "PADLEND_SIGN_CERT=$cert" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build, package, sign, checksum
        run: python tools/release.py --build --zip --installer --sign --sha256

      - name: Show outputs
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Select-Object Name, Length
          Get-Content dist\SHA256SUMS.txt

      - name: Publish GitHub Release
        # 手动触发只构建产物，不发布：只有 tag 才能创建 Release。
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          body_path: .github/release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: false
          files: |
            dist/PadLend-*-win64.zip
            dist/PadLend-*-setup.exe
            dist/SHA256SUMS.txt
