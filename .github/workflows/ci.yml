name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: react/typescript frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit + interaction tests
        run: npx vitest run

      - name: Typecheck + build
        run: npm run build

  engine:
    name: rust engine tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "padlend-core -> target"

      - name: Test
        run: cargo test --manifest-path padlend-core\Cargo.toml

  desktop:
    name: tauri 2 shell (compile check)
    runs-on: windows-latest
    needs: [frontend, engine]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install
        run: npm ci

      - name: Build frontend
        run: npm run build

      # externalBin 只声明了 padlend-core，缺少二进制时 tauri build 直接报错。
      - name: Build engine binary
        run: powershell -ExecutionPolicy Bypass -File tools\build-core.ps1

      # --no-bundle 仍会完整编译 Rust 外壳与前端资源，但不生成 NSIS 安装包，
      # 用来在推送 tag 之前先验证 Tauri 2 API 与 Rust 依赖能编译通过。
      - name: Compile Tauri app
        run: npx tauri build --no-bundle
