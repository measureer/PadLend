name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: python engine + service
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r requirements-build.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  frontend:
    name: react/typescript frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit + interaction tests
        run: npx vitest run

      - name: Typecheck + build
        run: npm run build

  desktop:
    name: tauri 2 shell (compile check)
    runs-on: windows-latest
    needs: [python, frontend]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-build.txt
          npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Python sidecar
        run: python tools/build_sidecar.py

      # --no-bundle 仍会完整编译 Rust 外壳与前端资源，但不生成 NSIS 安装包，
      # 用来在推送 tag 之前先验证 Tauri 2 API 与 Rust 依赖能编译通过。
      - name: Compile Tauri app
        run: npx tauri build --no-bundle
