[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "padlend"
version = "0.3.1"
description = "PadLend — use an Android tablet as a seamless side screen with a real system pointer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "PadLend contributors" }]
dependencies = [
    "PySide6>=6.7,<7",
    "PyYAML>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
padlend = "main:main"

[tool.setuptools]
py-modules = ["main", "config", "constants"]

[tool.setuptools.packages.find]
include = ["core*", "win*", "tablet*", "ui*", "padlend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = []
