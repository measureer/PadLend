[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "padlend"
dynamic = ["version"]
description = "PadLend - use an Android tablet as a Windows side screen (Tauri 2 desktop shell)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "PadLend contributors" }]
dependencies = [
    "PyYAML>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
padlend = "service.server:main"

[tool.setuptools]
py-modules = ["main", "config", "constants"]

[tool.setuptools.dynamic]
version = { attr = "padlend.__version__" }

[tool.setuptools.packages.find]
include = ["core*", "win*", "tablet*", "padlend*", "service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = []
